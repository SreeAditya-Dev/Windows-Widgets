name: Release

# Publish a release by pushing a version tag:  git tag v2.1.0 && git push origin v2.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}"; exit 1
          fi

      - name: Type-check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Package installer (unsigned)
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "${GITHUB_REF_NAME}" in *-*) FLAGS="--prerelease";; esac
          gh release create "${GITHUB_REF_NAME}" release/*.exe --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag $FLAGS
